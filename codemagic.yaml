
workflows:
  eddie-tools-android-debug:
    name: Eddie Tools AI - Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.eddiechat.kxmpzq"

    scripts:
      - name: Prepare Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          chmod +x ./gradlew

      - name: Check Gradle
        script: |
          ./gradlew --version

      - name: Build Debug APK
        script: |
          ./gradlew :app:assembleDebug

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/reports/**

