
name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Gradle Wrapper
        run: |
          mkdir -p /tmp/gradle-generator
          cd /tmp/gradle-generator

          cat > settings.gradle <<'EOF'
          rootProject.name = 'wrapper-generator'
          EOF

          cat > build.gradle <<'EOF'
          tasks.register('hello') {
              doLast {
                  println 'Wrapper generator ready'
              }
          }
          EOF

          gradle wrapper \
            --gradle-version 9.3.1 \
            --distribution-type bin

      - name: Copy wrapper into repository
        run: |
          cp /tmp/gradle-generator/gradlew .
          cp /tmp/gradle-generator/gradlew.bat .

          mkdir -p gradle/wrapper

          cp /tmp/gradle-generator/gradle/wrapper/* \
            gradle/wrapper/

          chmod +x gradlew

      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew gradlew.bat gradle/wrapper/

          git commit -m "build: add Gradle wrapper 9.3.1"

          git push
          
